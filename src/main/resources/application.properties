# Server
server.port=8090
spring.application.name=blog-app

# MySQL Connection
# Replace with your own DB host, port, and database name
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db
# Replace with your MySQL username
spring.datasource.username=root
# Replace with your MySQL password (leave empty if none)
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false

# Maximum file size (e.g., 10MB, 50MB, 100MB)
spring.servlet.multipart.max-file-size=500MB

# Maximum request size (total size including all files + form data)
spring.servlet.multipart.max-request-size=5000MB