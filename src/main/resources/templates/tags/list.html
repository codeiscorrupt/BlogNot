<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" /></head>
<body class="container">

<header>
    <div class="header-left">
        <a th:href="@{/posts}">Home</a>
        | <a th:href="@{/tags}">Trending Tags</a>
    </div>
    <div class="header-right">
        <div style="display: flex; align-items: center;">
            <a th:href="@{/users/{id} (id = ${loggedInUser.getId()})}" style="display: flex; align-items: center;">
                <img th:src="${loggedInUser.profile.avatar}" class="avatar-in-header" alt="flan's profile pic">
            </a>
            <a th:href="@{/users/{id} (id = ${loggedInUser.getId()})}" sec:authentication="name">Username</a>
        </div>
        | <a href="/logout"><button class="btn-logout"> Logout </button></a>
    </div>
</header>

<h1>&ensp;List Of Tags</h1>
<hr>
<th:block th:each="tag : ${tags}">
    <li>
        <a th:href="@{/tags/{id}(id=${tag.id})}"
           th:text="${tag.name}"></a>
        — <span th:text="${tag.getPostsCount()}" ></span> Posts
    </li>
</th:block>

<hr>
</body>
</html>
